  <rect x="160" y="176" width="9" height="164" rx="4.5" fill="#55719c"/>
  <rect x="192" y="181" width="152" height="38" rx="19" fill="#eef0f4"/>
  <rect x="192" y="240" width="107" height="38" rx="19" fill="#8fb0dd"/>
  <rect x="192" y="299" width="132" height="38" rx="19" fill="#55719c"/>
</svg>
